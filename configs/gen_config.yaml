# Configuração da geração sintética (Fase 1/2)

api:
  provider: anthropic
  model: claude-sonnet-5          # modelo gerador
  temperature: 0.9
  max_tokens: 2048
  # preços por Mtok para o estimador de custo (atualizar conforme tabela vigente)
  price_input_per_mtok_usd: 3.0
  price_output_per_mtok_usd: 15.0

dataset:
  target_total: 1000              # iteração 1 (alvo reduzido: fazer ~1k sólidos, treinar, avaliar, então escalar)
  pilot_size: 20                  # Fase 1: gerar e PARAR para revisão manual

# Proporções por camada (soma = 1.0) — seção 4.1 do PLANO.md
# think_max_words (branch phronesis-thinking): teto de palavras do bloco <think> por camada.
# Calibrado pra ficar curto nas camadas fáceis (o modelo aprende a dosar o esforço de
# deliberação pela dificuldade real, não só o preâmbulo visível) e livre nas camadas 2/3
# (raciocínio longo, ver prompts/generator_thinking_gpt56.md). Não conta como preâmbulo visível
# — strip_think_blocks() em src/common.py já exclui o <think> da métrica de preambulo_max_words.
#
# think_min_words (2026-07-26, item 2 do plano de correção pós-diagnóstico): auditoria de
# data/clean/dataset.jsonl mostrou mediana de 18-21 palavras de <think> na camada 3 MESMO
# com think_max_words: null — o teto null nunca impediu blocos curtos, só evitava bloquear
# os longos. O retrofit pós-hoc (prompts/editor_thinking_gpt56.md, item já resolvido antes
# de escrever o <think>) convergiu pra frases de conclusão ("A é bloco de Jordan; o termo
# nilpotente não pode desaparecer antes da verificação") em vez de deliberação real — uma
# legenda da resposta, não o processo que a produziu. Isso ensina o Qwen3-8B (que nativamente
# gera centenas/milhares de tokens de reasoning em thinking mode) a suprimir o próprio
# mecanismo de raciocínio. think_min_words nas camadas 2/3 rejeita blocos curtos demais pra
# serem deliberação genuína, forçando regeneração via rejection sampling (item 3) em vez de
# retrofit. Camadas 0/0.5/1/C não ganham mínimo — o think curto ali é roteamento de tool
# (buscar? calcular? só responder?), não derivação, e os evals mostraram que funciona bem
# nesse comprimento.
#
# Calibração dos valores (não são chute): medidos contra `gpt56_limites.jsonl`, a única
# família já regenerada think-first e verificada — o padrão-ouro. Camada 2 dela tem
# comprimentos 13..37 (mediana 31); camada 3, 63..113 (mediana 82).
#   camada 2 = 25 → corta 436/465 (93,8%) das legendas de retrofit e preserva 23/27 do
#     padrão-ouro. Um corte em 30 subiria para 462/465 (99,4%) mas derrubaria 11 dos 27
#     itens bons — problema fácil legitimamente tem deliberação curta ("substituição
#     direta resolve, a função é contínua no ponto"), e puni-la empurra o gerador a inflar
#     o think, que é exatamente o teatro que queremos evitar.
#   camada 3 = 60 → abaixo do mínimo observado no padrão-ouro (63), então não corta nada
#     de bom, e ainda assim elimina toda legenda de uma frase.
# REVISÃO DOS ALVOS (2026-07-27). Os `share` abaixo mudaram; os tetos/pisos de palavras não.
#
# Os alvos originais (0: 0.20, 0.5: 0.12, 1: 0.25, 2: 0.18, 3: 0.05, C: 0.20) foram definidos
# na seção 4.1 do plano, quando o projeto era só calibração de tool-use: decidir entre buscar,
# verificar no sandbox ou responder direto. Desde então o escopo cresceu — a avaliação
# pós-treino (data/eval/thinking_8b_eval_notes.md) mostrou que o modo de falha dominante não é
# roteamento de ferramenta, e sim rigor matemático/físico: 8 de 16 itens da bateria erraram por
# derivação inválida, física errada ou autocontradição, não por chamar a tool errada. A resposta
# a isso foi a destilação de matemática via GPT-5.6 (prompts/generator_math_gpt56.md), que
# adicionou centenas de itens de camada 2 e 3.
#
# Com isso a camada 2 chegou a 0.282 contra um alvo de 0.18. A alternativa a revisar o alvo era
# PODAR — mas fechar 0.18 exigiria deletar ~150 dos 340 itens de camada 2, que são exatamente a
# distilação mais cara do corpus. Apagar dado bom para bater um número herdado de outro escopo
# inverte meio e fim: o alvo existe para descrever o corpus que queremos, não o contrário.
#
# Os novos valores ficam perto da distribuição real, mantendo pressão apenas onde há evidência
# de que o desequilíbrio custa caro:
#   - camada 2 = 0.26 (real 0.282): reconhece o papel ampliado, mas segue puxando pra baixo.
#     Sobre-representar camada 2 tem risco medido de generalização torta — batch_012/013
#     registram o modelo super-aplicando o padrão de uma camada fora do contexto dela.
#   - camada C = 0.18 (real 0.165): puxa pra CIMA, e o valor não é chute. O batch_014 mediu
#     regressão de coerência conversacional com C em 0.143 e a resolveu subindo pra 0.182 —
#     então 0.18 é o nível empiricamente validado, mais defensável que os 0.20 originais.
#   - camada 0 = 0.16 (real 0.158) e 0.5 = 0.10 (real 0.103): alinhados ao corpus real. Ambas
#     são camadas de resposta curta; o alvo alto anterior não tinha evidência por trás.
#   - camada 1 = 0.24 (real 0.239) e 3 = 0.06 (real 0.054): praticamente onde já estavam.
#
# `share` alimenta só duas coisas: os pesos de amostragem do plano de tasks em
# src/generate_data.py e a coluna de comparação em data/clean/report.json. Nada no treino lê
# isto — mudar aqui não altera nenhum exemplo já validado.
layers:
  "0":   { share: 0.16, preamble_max_words: 0,  think_max_words: 15 }
  "0.5": { share: 0.10, preamble_max_words: 25, think_max_words: 25 }
  "1":   { share: 0.24, preamble_max_words: 40, think_max_words: 35 }
  "2":   { share: 0.26, preamble_max_words: null, think_max_words: null, think_min_words: 25 }
  "3":   { share: 0.06, preamble_max_words: null, think_max_words: null, think_min_words: 60 }
  "C":   { share: 0.18, preamble_max_words: null, think_max_words: 20 }

# Propriedades da camada 1 (verbalizadas no rationale)
layer1_properties:
  - volatilidade_temporal        # preços, cargos, placares, clima
  - evento_pos_cutoff            # lançamentos, notícias
  - especificidade_local         # horários, endereços
  - incerteza_propria            # dúvida sobre um dado específico

# Regras transversais
mix:
  lang: { pt-BR: 0.80, en: 0.20 }
  register_informal: 0.40        # ~40% com traços descontraídos visíveis
  multi_turn_share: 0.25         # 2–4 turnos de usuário
  layer2_selfcorrection: 0.30    # sandbox contradiz e o modelo se corrige
  # Iteração 1 mostrou que hedge/incerteza demais ensina o modelo a NÃO buscar (recall de web_search
  # caiu de 0.75 p/ 0.35). Reduzido de 0.10 p/ 0.06; e todo exemplo imperfeito DEVE buscar antes de ressalvar.
  imperfect_tool_responses: 0.06 # camadas 1 e 2: busca pobre, erro de sintaxe etc.

# Filtros do validate_data.py
validation:
  ngram_n: 6
  ngram_max_freq: 3              # frase-fôrma: 6-grama de rationale com freq > 3
  dedup_jaccard_threshold: 0.80  # dedup agressivo por similaridade
  banned_slang:
    - mano
    - "véi"
    - "vei"
    - top demais
    - brabo
    - braba
    - cringe
    - "tipo assim"
  sandbox_exec_timeout_s: 5
